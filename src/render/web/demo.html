<!doctype html>
<meta charset="utf-8">
<title>lcgf: web back end</title>
<!-- The render conformance scenes on a visible canvas, one per second, redrawn every animation
     frame: with WebGPU when the browser gives an adapter, else with the 2D-canvas fallback.
     ?scene=N shows one scene only; ?frames=N stops after N frames. smoke.py runs it in headless
     Chromium with and without WebGPU (ci/jobs/web.sh). -->
<style>body { margin: 0; background: #000; } canvas { display: block; width: 160px; height: 120px; }</style>
<canvas id="c" width="160" height="120"></canvas>
<script type="module">
import { load, webgpu, gpuProjection, canvas2d } from "./lcgf.js";

const canvas = document.getElementById("c");
const params = new URLSearchParams(location.search);
const only = params.has("scene") ? Number(params.get("scene")) : -1;
const max_frames = Number(params.get("frames") || Infinity);

async function gpuDevice() {
    const adapter = await navigator.gpu?.requestAdapter();
    return adapter ? await adapter.requestDevice() : null;
}

window.lcgfTest = (async () => {
    const errors = [];
    const device = await gpuDevice();
    // Without WebGPU, the 2D part owns the canvas; a canvas has one kind of context for life.
    // Custom commands are drawn inside scenes.wasm, through lcgf_render.gpu (gpuProjection).
    const ui = await load("scenes.wasm", webgpu, gpuProjection, canvas2d(device ? document.createElement("canvas") : canvas));
    const x = ui.exports;
    let draw;
    if (device) {
        device.addEventListener("uncapturederror", (e) => errors.push(e.error.message));
        const format = navigator.gpu.getPreferredCanvasFormat();
        const ctx = canvas.getContext("webgpu");
        ctx.configure({ device, format, alphaMode: "opaque" });
        const texture = (w, h, px) => {
            const t = device.createTexture({ size: [w, h], format: "rgba8unorm", usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
            device.queue.writeTexture({ texture: t }, px, { bytesPerRow: w * 4 }, [w, h]);
            return t.createView();
        };
        const { put, release } = ui.gpu;
        const sampler = device.createSampler({ magFilter: "nearest", minFilter: "nearest" });
        const atlas = new Uint8Array(64 * 64 * 4); // glyphs show as blocks, as in the goldens
        for (let b = 33; b < 127; b++) for (let y = 1; y < 4; y++) for (let x = 1; x < 3; x++) atlas.fill(255, (((b >> 4) * 4 + y) * 64 + (b & 15) * 4 + x) * 4, (((b >> 4) * 4 + y) * 64 + (b & 15) * 4 + x) * 4 + 4);
        x.lcgf_webgpu_init(put(device), put(device.queue), format === "bgra8unorm" ? 1 : 0, put(texture(1, 1, new Uint8Array([255, 255, 255, 255]))), put(sampler), put(texture(64, 64, atlas)));
        draw = (i) => {
            x.lcgf_scene_prepare(i);
            const encoder = device.createCommandEncoder();
            const pass = encoder.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: "clear", storeOp: "store", clearValue: [0, 0, 0, 1] }] });
            const p = put(pass);
            x.lcgf_scene_draw(p);
            release(p);
            pass.end();
            device.queue.submit([encoder.finish()]);
        };
    } else {
        draw = (i) => x.lcgf_canvas_scene(i);
    }
    const count = x.lcgf_scene_count();
    let frames = 0;
    await new Promise((done) => {
        const frame = (ms) => {
            draw(only >= 0 ? only : Math.floor(ms / 1000) % count);
            if (++frames >= max_frames) done();
            else requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
    });
    return { ok: errors.length === 0, errors, backend: device ? "webgpu" : "canvas2d", frames };
})();
</script>
