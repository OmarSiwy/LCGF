<!doctype html>
<meta charset="utf-8">
<title>lcgr: WebGPU conformance</title>
<!-- Draws every render conformance scene with the WebGPU back end (webgpu.zig, scenes.wasm) and
     reads each back. The host side mirrors src/render/wgpu/play.zig and render.py, which drew
     the goldens: an RGBA8 target cleared to black, nearest sampling, scale 1, the stand-in glyph
     atlas, and the host's own gradient pipeline at each custom command. browser.py --out writes
     the images; ci/jobs/web.sh compares them with src/render/conformance/*.png. -->
<script type="module">
import { load, webgpu, canvas2d } from "./lcgr.js";
import { readback, base64, standInAtlas } from "./test_util.js";

window.lcgrTest = (async () => {
    const adapter = await navigator.gpu.requestAdapter();
    const device = await adapter.requestDevice();
    const errors = [];
    device.addEventListener("uncapturederror", (e) => errors.push(e.error.message));

    let scene = null; // the host pipeline of the scene being drawn
    const host = (ui) => ({
        host_custom(p, x0, y0, x1, y1) {
            const pass = ui.gpu.get(p);
            pass.setPipeline(scene.pipe);
            pass.setScissorRect(x0, y0, x1 - x0, y1 - y0);
            pass.draw(3);
            pass.setScissorRect(0, 0, scene.w, scene.h);
        },
    });
    const ui = await load("scenes.wasm", webgpu, canvas2d(document.createElement("canvas")), host);
    const { put, release } = ui.gpu;

    const texture = (w, h, px) => {
        const t = device.createTexture({ size: [w, h], format: "rgba8unorm", usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
        device.queue.writeTexture({ texture: t }, px, { bytesPerRow: w * 4 }, [w, h]);
        return t.createView();
    };
    const sampler = device.createSampler({ magFilter: "nearest", minFilter: "nearest" });
    ui.exports.lcgr_webgpu_init(put(device), put(device.queue), 0, put(texture(1, 1, new Uint8Array([255, 255, 255, 255]))), put(sampler), put(texture(64, 64, standInAtlas())));

    const images = {};
    for (let i = 0; i < ui.exports.lcgr_scene_count(); i++) {
        const size = ui.exports.lcgr_scene_size(i);
        const name = ui.logs.at(-1);
        const w = size & 0xffff, h = size >>> 16;
        const module = device.createShaderModule({ code: `
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  return vec4f(f32(i & 1u) * 4.0 - 1.0, f32(i >> 1u) * 4.0 - 1.0, 0.0, 1.0); }
@fragment fn fs(@builtin(position) p: vec4f) -> @location(0) vec4f {
  return vec4f(p.x / ${w}.0 * 0.5, 0.25, p.y / ${h}.0 * 0.6, 1.0); }` });
        scene = { w, h, pipe: device.createRenderPipeline({ layout: "auto", vertex: { module, entryPoint: "vs" }, fragment: { module, entryPoint: "fs", targets: [{ format: "rgba8unorm" }] } }) };

        const target = device.createTexture({ size: [w, h], format: "rgba8unorm", usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
        ui.exports.lcgr_scene_prepare(i);
        const encoder = device.createCommandEncoder();
        const pass = encoder.beginRenderPass({ colorAttachments: [{ view: target.createView(), loadOp: "clear", storeOp: "store", clearValue: [0, 0, 0, 1] }] });
        const p = put(pass);
        ui.exports.lcgr_scene_draw(p);
        release(p);
        pass.end();
        device.queue.submit([encoder.finish()]);
        images[name] = { w, h, rgba: base64(await readback(device, target, w, h)) };
        target.destroy();
    }
    return { ok: errors.length === 0, errors, adapter: adapter.info?.description || adapter.info?.vendor, images };
})();
</script>
