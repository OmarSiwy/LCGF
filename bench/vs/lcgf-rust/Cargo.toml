[package]
name = "vs-lcgf-rust"
version = "0.0.0"
edition = "2024"
publish = false

# LCGF from Rust: lcgf::runtime over the prebuilt liblcgf (LCGF_PREFIX), no Zig compiler.
# bench/vs/lcgf-rust/main.rs says what is measured.
[workspace]

[dependencies]
lcgf = { path = "../../../bindings/rust/lcgf" }

[[bin]]
name = "vs-lcgf-rust"
path = "main.rs"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"

[profile.small]
inherits = "release"
opt-level = "s"
strip = true
