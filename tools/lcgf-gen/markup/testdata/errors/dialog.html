<!doctype html>
<html>
<head>
  <style>
    dialog { margin: 10px; box-shadow: 2px 2px 4px #000; }
    dialog::backdrop { padding: 4px; background: linear-gradient(#000, #fff); }
    dialog::backdrop { --shade: red; }
    span::backdrop { background-color: red; }
  </style>
</head>
<body>
  <dialog id="d" bind:open="d"><span>Hi</span></dialog>
</body>
</html>
