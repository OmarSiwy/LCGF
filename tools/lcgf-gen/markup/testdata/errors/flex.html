<!doctype html>
<style>
  .cw { display: flex; flex-direction: column; flex-wrap: wrap; }
  .rw { display: flex; flex-wrap: wrap-reverse; align-content: baseline; }
  .cw { aspect-ratio: 1 / 0; }
  .rw { aspect-ratio: 16 9; }
  .gaps { display: flex; flex-wrap: wrap; row-gap: 2px; column-gap: 4px; align-items: baseline; justify-content: space-around; }
</style>
<body><div class="cw"><span>c</span></div><div class="rw"><span>d</span></div><div class="gaps"><span>e</span><span>f</span></div></body>
