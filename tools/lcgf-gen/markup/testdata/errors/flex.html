<!doctype html>
<style>
  .col { display: flex; flex-direction: column; align-items: baseline; }
  .cw { display: flex; flex-direction: column; flex-wrap: wrap; }
  .rw { display: flex; flex-wrap: wrap-reverse; }
  .gaps { display: flex; flex-wrap: wrap; row-gap: 2px; column-gap: 4px; align-items: baseline; }
</style>
<body><div class="col"><span>a</span><span>b</span></div><div class="cw"><span>c</span></div><div class="rw"><span>d</span></div><div class="gaps"><span>e</span><span>f</span></div></body>
