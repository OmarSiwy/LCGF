<!doctype html>
<style>
  .g { display: grid; grid-template-columns: repeat(auto-fill, 40px) 10px [a] 10% 1fr; grid-template-areas: "a b" "c"; }
  .one { grid-column: 2; }
  .bad { grid-row: 3 / 1; }
  .loose { grid-area: nowhere; }
  .out { justify-self: center; }
  .cw { columns: 120px; }
  .ct { column-count: 2; }
</style>
<body><div class="g"><span class="one">1</span><span class="bad">2</span><span class="loose">3</span></div><p class="out">x</p><div class="cw"><p>a</p></div><div class="ct">loose <p>b</p></div></body>
