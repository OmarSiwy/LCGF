<!doctype html>
<html lcgf-page="adapters">
<head>
  <title>Adapters</title>
  <style>
    a:hover { background-color: #5078c8; }
    button[aria-pressed]:hover { background-color: #c85050; }
    input[type=radio]:hover { background-color: #50c878; }
    input[type=search]:hover { background-color: #c8b450; }
    textarea:invalid { border-color: #c85050; }
  </style>
</head>
<body>
  <a href="docs.html" id="docs" on:click="open_docs">Read the docs</a>
  <button aria-pressed="false" id="bold" bind:pressed="bold">Bold</button>
  <label><input type="radio" name="size" bind:selected="size"> Small</label>
  <label><input type="radio" name="size" checked> Large</label>
  <input type="search" id="find" bind:value="find" placeholder="Find" on:change="found">
  <textarea id="notes" bind:value="notes" rows="2" placeholder="Notes" required></textarea>
</body>
</html>
