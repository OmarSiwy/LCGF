<!doctype html>
<html lcgf-page="copies">
<head>
  <title>Copies</title>
  <style>
    .list { width: 400px; height: 200px; gap: 4px; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row:hover { background-color: #283040; }
    button:hover { background-color: #c85050; }
    button { transition: background-color 0.1s; }
    input:checked { background-color: #50c878; }
  </style>
</head>
<body>
  <template lcgf-each="task in tasks" lcgf-max="4" class="list">
    <div class="row">
      <input type="checkbox" checked="{task.done}" on:change="toggled">
      <button id="go" on:click="go">Go</button>
      <span>{task.title}</span>
    </div>
  </template>
</body>
</html>
