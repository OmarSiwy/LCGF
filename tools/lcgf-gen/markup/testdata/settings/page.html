<!doctype html>
<html lcgf-page="settings">
<head>
  <title>Settings</title>
  <style>
    form { padding: 12px; gap: 8px; }
    .actions { display: flex; gap: 4px; }
  </style>
</head>
<body>
  <form aria-label="Settings">
    <label for="wifi">Wi-Fi</label>
    <input type="checkbox" switch id="wifi" bind:checked="wifi" checked>
    <button aria-pressed="false" id="bold" bind:pressed="bold">Bold</button>
    <input type="hidden" name="version" value="2">
    <div class="actions">
      <input type="button" id="apply" value="Apply" on:click="apply">
      <button id="reset" on:click="reset">{reset_text}</button>
    </div>
  </form>
</body>
</html>
