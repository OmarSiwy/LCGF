<!doctype html>
<html lcgf-page="todo">
<head>
  <title>Todo</title>
  <style>
    .items { gap: 2px; }
  </style>
</head>
<body>
  <label><input type="checkbox" id="show" bind:checked="show_done"> Show done</label>
  <template lcgf-if="show_done">
    <span>Done items are shown</span>
  </template>
  <template lcgf-each="count" lcgf-max="3" class="items">
    <section aria-label="Todo item"><span>Item</span></section>
  </template>
  <template lcgf-switch="mode">
    <template lcgf-case="compact"><span>Compact</span></template>
    <template lcgf-case="detailed"><div><span>Detailed</span></div></template>
  </template>
  <template lcgf-if="busy">
    <span>Saving</span>
  </template>
  <template lcgf-else>
    <span>Saved</span>
  </template>
</body>
</html>
