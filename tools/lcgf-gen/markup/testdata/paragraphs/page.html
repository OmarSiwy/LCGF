<!doctype html>
<html lcgf-page="paragraphs">
<head>
  <title>Paragraphs</title>
  <style>
    body { line-height: 1.5; }
    .loose { letter-spacing: 2px; word-spacing: 0.5em; }
    .cut { width: 120px; overflow: hidden; text-overflow: ellipsis; }
    .fixed { line-height: 30px; }
  </style>
</head>
<body>
  <p>A paragraph with an inherited line height of one and a half.</p>
  <span class="loose">Spaced out words</span>
  <div class="cut">A line that is far too long to fit</div>
  <h2 class="fixed">Thirty pixels</h2>
</body>
</html>
