<!doctype html>
<html lcgf-page="positioned">
<head>
  <title>Positioned</title>
  <style>
    .card { width: 200px; height: 120px; padding: 6px; background-color: #303440; }
    .badge { position: absolute; top: 4px; right: 4px; background-color: #c03030; z-index: 2; }
    .corner { position: absolute; right: 8px; bottom: 6px; }
    .cover { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background-color: #00000040; z-index: 1; }
    .toast { position: fixed; right: 10px; bottom: 10px; padding: 4px; background-color: #205030; z-index: 3; }
    .head { position: sticky; top: 140px; }
    .glow { position: absolute; left: 2px; top: 2px; width: 40px; height: 20px; background-color: #405080; z-index: -1; }
    .nudge { position: relative; right: 5px; bottom: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="nudge">Title</span>
    <div class="cover"></div>
    <span class="badge">3</span>
    <span class="corner">More</span>
    <div class="glow"></div>
  </div>
  <div class="head">Section</div>
  <div class="toast">Saved</div>
</body>
</html>
