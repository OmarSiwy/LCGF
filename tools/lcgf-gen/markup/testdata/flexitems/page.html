<!doctype html>
<html lcgf-page="flexitems">
<head>
  <title>Flex items</title>
  <style>
    .bar { display: flex; gap: 4px; }
    .bar span { margin: 2px 6px; }
    .bar span:last-child { margin-left: 0; }
    .tall { display: flex; height: 40px; }
    .mid { align-self: center; }
    .base { display: flex; align-items: baseline; gap: 4px; }
    .big { font-size: 24px; }
    .tags { display: flex; flex-flow: row wrap; gap: 4px; width: 60px; height: 80px; align-content: center; }
    .spread { display: flex; width: 200px; gap: 4px; justify-content: space-between; }
    .around { display: flex; flex-direction: column; height: 60px; justify-content: space-evenly; }
    .split { display: flex; flex-wrap: wrap; width: 60px; height: 80px; align-content: space-between; }
    .fillwrap { display: flex; flex-wrap: wrap; width: 60px; height: 80px; }
    .colbase { display: flex; flex-direction: column; align-items: baseline; }
    .wide { width: 40px; aspect-ratio: 2 / 1; background-color: #c04040; }
  </style>
</head>
<body>
  <div class="bar"><span>A</span><span>B</span></div>
  <div class="tall"><span>top</span><span class="mid">C</span></div>
  <div class="base"><span class="big">Big</span><span>small</span></div>
  <div class="tags" aria-label="Tags"><span>one</span><span>two</span><span>three</span></div>
  <div class="split"><span>one</span><span>two</span><span>three</span></div>
  <div class="fillwrap"><span>one</span><span>two</span></div>
  <div class="colbase"><span>p</span><span>q</span></div>
  <div class="wide"></div>
  <div class="spread"><span>L</span><span>M</span><span>R</span></div>
  <div class="around"><span>x</span><span>y</span></div>
</body>
</html>
