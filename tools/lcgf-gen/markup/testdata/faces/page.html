<!doctype html>
<html lcgf-page="faces">
<head>
  <title>Faces</title>
  <style>
    button { width: 120px; border: 2px solid #c03030; }
    .wide { width: 200px; }
    #level { width: 160px; height: 12px; }
    #bold { margin: 4px 8px; }
    #go { color: #ffcc00; font-size: 16px; }
    progress { width: 160px; height: 4px; }
    hr { width: 100px; background-color: #c03030; }
    #size { width: 200px; }
    a { padding: 6px; }
    #lit { box-shadow: 2px 3px 4px #000; outline: 2px solid #f0f0f0; outline-offset: 1px; }
  </style>
</head>
<body>
  <button id="go" on:click="go">Go</button>
  <button aria-pressed="false" id="bold" bind:pressed="bold">Bold</button>
  <label><input type="checkbox" id="done" class="wide" bind:checked="done"> Done</label>
  <input type="checkbox" switch id="wifi" class="wide" bind:checked="wifi">
  <input type="range" id="level" bind:value="level">
  <button id="lit">Lit</button>
  <progress value="{level}"></progress>
  <hr>
  <label><input type="radio" id="size" name="size" bind:selected="size"> Small</label>
  <label><input type="radio" name="size"> Large</label>
  <a href="#docs" id="docs" on:click="read">Docs</a>
</body>
</html>
