<!doctype html>
<html lcgf-page="tokens">
<head>
  <title>Tokens</title>
  <style>
    :root { --t-space: 8px; --t-panel: #203040; --t-ink: #ffd080; --t-big: 20px; --t-round: 3px; }
    .card { padding: var(--t-space) 4px; gap: var(--t-space); background-color: var(--t-panel); border-radius: var(--t-round); }
    .title { font-size: var(--t-big); color: var(--t-ink); }
    .fixed { width: 120px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="title">Title</span>
    <span class="fixed">Body</span>
  </div>
</body>
</html>
