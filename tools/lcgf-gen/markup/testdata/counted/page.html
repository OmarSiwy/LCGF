<!doctype html>
<html lcgf-page="counted">
<head>
  <title>Counted</title>
  <style>
    .list { width: 300px; height: 80px; }
  </style>
</head>
<body>
  <ol start="3" style="list-style-type: upper-roman">
    <template lcgf-each="item in items" class="list"><li>{item.name}</li></template>
  </ol>
  <ol reversed>
    <template lcgf-each="step in steps" class="list"><li>{step.name}</li></template>
  </ol>
</body>
</html>
