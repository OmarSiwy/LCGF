<!doctype html>
<html lcgf-page="controls">
<head><title>Controls</title></head>
<body>
  <input type="number" id="qty" bind:value="qty" min="1" max="10" step="1">
  <fieldset>
    <label><input type="radio" name="size" bind:selected="size" on:change="size_changed"> Small</label>
    <label><input type="radio" name="size" checked> Medium</label>
    <label><input type="radio" name="size"> Large</label>
  </fieldset>
</body>
</html>
