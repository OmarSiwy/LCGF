<!doctype html>
<html lcgf-page="content">
<head>
  <title>Content</title>
  <style>
    :root { accent-color: #3080e0; }
    .caps { text-transform: uppercase; }
    .title { text-transform: capitalize; }
    .ring { outline: 2px solid #ffcc00; outline-offset: 1px; border-radius: 3px; }
    details { width: 200px; }
    summary { padding: 4px 10px; border: 1px solid #ffcc00; }
    .card { width: 120px; margin: 4px; padding: 8px; background-color: #333; border-radius: 4px; box-shadow: 0 2px 6px 1px rgba(0, 0, 0, 0.5); }
  </style>
</head>
<body>
  <a href="docs.html" id="docs" on:click="open_docs">Read the docs</a>
  <div class="caps"><span>shout</span><span class="title">two words</span><span>straße</span><span lang="tr">istanbul</span></div>
  <ul>
    <li>Plain</li>
    <li><span>Inside</span><span>a box</span></li>
  </ul>
  <ol start="3"><li>First</li><li style="list-style-type: square">Square</li></ol>
  <ul style="list-style: none"><li>Bare</li></ul>
  <ol start="4" style="list-style-type: upper-roman"><li>Four</li><li style="list-style-type: lower-greek">Five</li></ol>
  <ul style='list-style-type: "- "'><li>Dash</li></ul>
  <ol reversed><li>Two</li><li>One</li></ol>
  <div class="card"><span>Card</span><span>body</span></div>
  <div class="ring"><span>Ringed</span></div>
  <details id="more" bind:open="more_open" open>
    <summary>More</summary>
    <p>Hidden text</p>
  </details>
</body>
</html>
