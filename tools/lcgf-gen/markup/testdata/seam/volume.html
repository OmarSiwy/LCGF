<!doctype html>
<!-- A page in the static subset (lcgf-gen page.html --static): rows, columns, labels, captionless
     checkboxes and 0-to-1 sliders, the structure fixed. src/abi/testdata/static/controls.zon, in HTML. -->
<html lcgf-page="volume">
<head>
  <title>Volume</title>
  <style>
    body { display: flex; flex-direction: column; padding: 4px; gap: 4px; }
    .row { display: flex; gap: 8px; }
    input { background: rgb(90, 90, 90); }
    #mute { width: 16px; height: 16px; background: rgb(200, 200, 200); }
    #volume { width: 100%; height: 12px; }
    #pan { width: 100px; height: 10px; }
  </style>
</head>
<body>
  <div class="row">
    <input type="checkbox" id="mute" bind:checked="muted">
    <span>{title}</span>
  </div>
  <input type="range" id="volume" bind:value="volume" value="0.5">
  <input type="range" id="pan" bind:value="pan">
</body>
</html>
