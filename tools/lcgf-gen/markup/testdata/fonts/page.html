<!doctype html>
<html lcgf-page="fonts">
<head>
  <title>Fonts</title>
  <style>
    @font-face { font-family: "Test Sans"; src: url("../../../../../src/text/font/testdata/test.ttf") format("truetype"); }
    @font-face { font-family: "Test Sans"; font-weight: 700; src: url("../../../../../src/text/font/testdata/test.ttf"); }
    @font-face { font-family: Test Sans; font-style: italic; src: url("../../../../../src/text/font/testdata/test.ttf"); }
    body { font-family: "Test Sans", sans-serif; }
    .bolder { font-weight: bolder; }
    .plain { font-family: system-ui; }
  </style>
</head>
<body>
  <p>Regular</p>
  <strong>Bold</strong>
  <em>Italic</em>
  <span class="bolder">Bolder</span>
  <code>monospace</code>
  <span class="plain">Theme font</span>
</body>
</html>
