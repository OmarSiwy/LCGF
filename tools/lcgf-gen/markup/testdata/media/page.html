<!doctype html>
<html lcgf-page="media">
<head>
  <title>Media</title>
  <style>
    button { background-color: #3a3c46; }
    @media (max-width: 500px) { button { background-color: #c05030; } }
    @media (orientation: portrait) { button { border: 1px solid #ffffff; } }
    @media screen and (min-width: 501px) { @media (min-height: 300px) { #go:hover { color: #ffd040; } } }
    @media (min-width: 2000px), (max-height: 400px) { button { opacity: 0.5; } }
    @media not all and (min-width: 600px) { button { border-color: #00ff00; } }
    @media (hover: hover) and (pointer: fine) { #go:active { opacity: 0.9; } }
    @media not print { button { padding: 6px; } }
    @media print { button { padding: 40px; } }
  </style>
</head>
<body>
  <button id="go" on:click="go">Go</button>
</body>
</html>
