<!doctype html>
<html lcgf-page="media">
<head>
  <title>Media</title>
  <style>
    button { background-color: #3a3c46; }
    @media (max-width: 500px) { button { background-color: #c05030; } }
    @media (orientation: portrait) { button { border: 1px solid #ffffff; } }
    @media screen and (min-width: 501px) { @media (min-height: 300px) { #go:hover { color: #ffd040; } } }
  </style>
</head>
<body>
  <button id="go" on:click="go">Go</button>
</body>
</html>
