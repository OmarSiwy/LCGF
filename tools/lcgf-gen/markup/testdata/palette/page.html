<!doctype html>
<html lcgf-page="palette">
<head>
  <title>Palette</title>
  <style>
    body { align-items: center; }
    .hits { gap: 2px; }
  </style>
</head>
<body>
  <template lcgf-each="hit in hits" class="hits">

  <span>Footer</span>
</body>
</html>
