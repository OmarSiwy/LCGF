<!doctype html>
<html lcgf-page="scrolling">
<head>
  <title>Scrolling</title>
  <style>
    .list { width: 160px; height: 80px; overflow-y: auto; }
    .head { position: sticky; top: 0; background-color: #303440; }
  </style>
</head>
<body>
  <div class="list" id="nets">
    <div>
      <div class="head">Inputs</div>
      <span>in1</span>
      <span>in2</span>
      <span>in3</span>
    </div>
    <div>
      <div class="head">Outputs</div>
      <span>out1</span>
      <span>out2</span>
      <span>out3</span>
    </div>
  </div>
</body>
</html>
