<!doctype html>
<html lcgf-page="grid">
<head>
  <title>Grid</title>
  <style>
    .layout {
      display: grid;
      grid-template-columns: 120px 1fr;
      grid-template-rows: 40px auto 30px;
      grid-template-areas: "head head" "side main" "foot foot";
      gap: 6px 8px;
      padding: 4px;
    }
    .head { grid-area: head; background-color: #203040; }
    .side { grid-area: side; align-self: start; }
    .main { grid-area: main; }
    .foot { grid-area: foot; justify-self: end; }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(40px, 1fr));
      grid-auto-rows: 24px;
      column-gap: 4px;
      row-gap: 2px;
      justify-items: center;
    }
    .wide { grid-column: span 2; }
    .placed { grid-column: 3; grid-row: 2 / 4; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 4px; width: 280px; }
    .news { columns: 3; column-gap: 6px; width: 240px; }
    .narrow { columns: 50px 8; column-gap: 10px; width: 230px; }
    .pair { display: grid; grid-template-columns: 90px 1fr; }
    .wrapbase { display: flex; flex-wrap: wrap; align-items: baseline; align-content: start; }
    .big { font-size: 24px; }
    .flow { display: grid; grid-template-rows: auto auto; grid-auto-flow: column dense; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="head">Head</div>
    <div class="side">Side</div>
    <div class="main">
      <div class="cards">
        <span>A</span>
        <span class="wide">B</span>
        <span>C</span>
        <span class="placed">D</span>
        <span>E</span>
      </div>
    </div>
    <div class="foot">Foot</div>
  </div>
  <div class="tiles"><span>t1</span><span>t2</span><span>t3</span><span>t4</span><span>t5</span><span>t6</span></div>
  <div class="news"><div>n1</div><div>n2</div><div>n3</div><div>n4</div><div>n5</div></div>
  <div class="narrow"><div>c1</div><div>c2</div><div>c3</div><div>c4</div><div>c5</div><div>c6</div><div>c7</div></div>
  <div class="pair"><div class="wrapbase"><span class="big">Big</span><span>small</span><span>next</span></div><span>x</span></div>
  <div class="flow"><span>1</span><span>2</span><span>3</span></div>
</body>
</html>
