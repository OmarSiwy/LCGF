<!doctype html>
<html lcgf-page="components">
<head>
  <title>Components</title>
  <style>
    .list { width: 300px; height: 200px; gap: 2px; }
  </style>
</head>
<body>
  <sfy-meter level="{gain}" caption="Gain" style="margin: 2px 6px"></sfy-meter>
  <input type="range" bind:value="gain">
  <sfy-panel heading="Tools">
    <button id="save" on:click="save">Save</button>
    <sfy-tool id="zoom" icon="+" on:click="zoom"></sfy-tool>
  </sfy-panel>
  <template lcgf-each="net in nets" class="list">
    <sfy-net id="pick" name="{net.name}" on:click="pick"></sfy-net>
    <sfy-tool id="row_zoom" icon="z" on:click="row_zoom"></sfy-tool>
    <sfy-chip mark="#">
      <span>{net.name}</span>
    </sfy-chip>
  </template>
</body>
</html>
