<!doctype html>
<html lcgf-page="counter">
<head>
  <title>Counter</title>
  <link rel="stylesheet" href="counter.css">
</head>
<body>
  <div class="row">
    <button id="dec" on:click="dec">-</button>
    <button id="inc" on:click="inc">+</button>
    <span class="count">Count: {count:.0}</span>
  </div>
  <div id="summary">{summary}</div>
</body>
</html>
