<!doctype html>
<html lcgf-page="fields">
<head>
  <title>Fields</title>
  <style>
    input, textarea { width: 220px; border-color: #c03030; }
    #pin { padding: 2px 4px; }
    #qty { width: 100px; }
  </style>
</head>
<body>
  <input type="text" id="name" bind:value="name" placeholder="Name">
  <input type="password" id="pin" bind:value="pin">
  <input type="search" id="find" bind:value="query" placeholder="Find">
  <input type="number" id="qty" bind:value="qty" min="0" max="9" step="1">
  <textarea id="note" bind:value="note" rows="2"></textarea>
</body>
</html>
