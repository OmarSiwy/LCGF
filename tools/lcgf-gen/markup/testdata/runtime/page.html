<!doctype html>
<html lcgf-page="runtime" lcgf-frontend="runtime">
<head>
  <title>Runtime</title>
  <style>
    .bar { display: flex; gap: 6px; padding: 4px; }
    .value { color: #80c0ff; }
  </style>
</head>
<body>
  <div class="bar">
    <button id="less" on:click="less">Less</button>
    <button id="more" on:click="more">More</button>
    <span class="value">{level:.2}</span>
  </div>
  <input type="range" id="level" bind:value="level" on:change="level_changed">
  <template lcgf-switch="view">
    <template lcgf-case="small"><span>Small</span></template>
    <template lcgf-case="large"><div><span>Large</span></div></template>
  </template>
</body>
</html>
