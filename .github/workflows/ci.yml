name: ci

on:
  push:
    branches-ignore: [benchmark-results]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Formatting
        run: nix develop -c zig build fmt
      - name: Commit messages
        run: |
          python3 tools/commitlint/commitlint.py --self-test
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "$GITHUB_REF_NAME" = experiment/metal-custom-draw ]; then
            range="origin/${{ github.event.repository.default_branch }}..HEAD"
          elif [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}"
          fi
          python3 tools/commitlint/commitlint.py "$range"

  # One matrix entry per ci/jobs/<name>.sh, so adding a job never edits this file.
  jobs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          matrix=$(ci/run.sh --matrix | jq -c '[.[] | select(.job != "gates-vs")]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    needs: jobs
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.jobs.outputs.matrix) }}
    name: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@v4
      # Linux and macOS: the flake's dev shell. Windows has no Nix: the same Zig build as
      # flake.nix pins, from setup-zig, and Git Bash runs the job.
      - if: runner.os != 'Windows'
        uses: cachix/install-nix-action@v31
      - if: runner.os != 'Windows'
        run: nix develop .#${{ matrix.shell }} -c ci/run.sh ${{ matrix.job }}
      - if: runner.os == 'Windows'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.18.0-dev.1151+8dfb7a7cc # keep equal to flake.nix
      - if: runner.os == 'Windows'
        shell: bash
        run: ci/run.sh ${{ matrix.job }}

  gates-vs:
    if: github.ref != 'refs/heads/experiment/metal-custom-draw'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop .#vs -c ci/run.sh gates-vs
      - name: Save comparison measurements
        id: upload
        if: ${{ !cancelled() && hashFiles('zig-out/comparison/README.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: framework-comparison-${{ github.run_attempt }}
          path: zig-out/comparison/
          if-no-files-found: error
      - name: Show measured results
        if: ${{ !cancelled() && hashFiles('zig-out/comparison/README.md') != '' }}
        run: sed '/^\[Raw measurements/d' zig-out/comparison/README.md >> "$GITHUB_STEP_SUMMARY"

  publish-benchmarks:
    needs: gates-vs
    if: ${{ !cancelled() && needs.gates-vs.outputs.artifact != '' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-benchmark-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.gates-vs.outputs.artifact }}
          merge-multiple: true
          path: comparison
      - name: Update the measured results branch
        run: bench/vs/publish.sh comparison
