name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Formatting
        run: nix develop -c zig build fmt
      - name: Commit messages
        run: |
          python3 tools/commitlint/commitlint.py --self-test
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}"
          fi
          python3 tools/commitlint/commitlint.py "$range"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [debug, release-safe, release-fast, lanes-4, lanes-8, cross]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c ci/run.sh ${{ matrix.job }}

  # Golden images and the GPU pixel check (tools/golden/), on Mesa lavapipe.
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop .#golden -c ci/run.sh golden
