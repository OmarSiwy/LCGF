name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Formatting
        run: nix develop -c zig build fmt
      - name: Commit messages
        run: |
          python3 tools/commitlint/commitlint.py --self-test
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}"
          fi
          python3 tools/commitlint/commitlint.py "$range"

  # One matrix entry per ci/jobs/<name>.sh, so adding a job never edits this file.
  jobs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "matrix=$(ci/run.sh --matrix)" >> "$GITHUB_OUTPUT"

  test:
    needs: jobs
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.jobs.outputs.matrix) }}
    name: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@v4
      # Linux and macOS: the flake's dev shell. Windows has no Nix: the same Zig build as
      # flake.nix pins, from setup-zig, and Git Bash runs the job.
      - if: runner.os != 'Windows'
        uses: cachix/install-nix-action@v31
      - if: runner.os != 'Windows'
        run: nix develop .#${{ matrix.shell }} -c ci/run.sh ${{ matrix.job }}
      - if: runner.os == 'Windows'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.18.0-dev.1151+8dfb7a7cc # keep equal to flake.nix
      - if: runner.os == 'Windows'
        shell: bash
        run: ci/run.sh ${{ matrix.job }}
