# LCGF for Rust: the runtime crate (`lcgf`), the `ui!` proc macro (`lcgf-macros`), the static
# UIs' frame builder for build scripts (`lcgf-build`) and the
# bindings' gate (`lcgf-check`, bindings/check/run.sh). Built against an installed
# `zig build abi` prefix (LCGF_PREFIX); no Zig compiler is needed.
[workspace]
resolver = "3"
members = ["lcgf", "lcgf-macros", "lcgf-build", "lcgf-check"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# The gate times these binaries against Zig's ReleaseFast ones: build them alike (as
# bench/vs/lcgf-rust does), with one codegen unit, LTO and no unwinding.
[profile.release]
codegen-units = 1
lto = true
panic = "abort"
