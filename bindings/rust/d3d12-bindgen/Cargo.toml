# Writes lcgf/src/gpu/d3d12_sys.rs: the Direct3D 12 types and interfaces lcgf::gpu's `d3d12`
# back end uses, generated by windows-bindgen from Microsoft's metadata (the windows crate's
# source), so they build on any host and convert to the windows crate's by pointer on Windows.
# Not part of the workspace: run it by hand when src/names.txt changes.
#
#   cargo run --manifest-path bindings/rust/d3d12-bindgen/Cargo.toml -- bindings/rust/lcgf/src/gpu/d3d12_sys.rs
[package]
name = "d3d12-bindgen"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
windows-bindgen = "0.65"
