[package]
name = "lcgf"
description = "LCGF from Rust: generated UIs over the prebuilt frame (liblcgf), and lcgf_render.gpu's model in wgpu's shape"
edition.workspace = true
version.workspace = true
license.workspace = true
build = "build.rs"
links = "lcgf"

[dependencies]
lcgf-macros = { path = "../lcgf-macros" }
# Types only (no loader: the host brings its own device); `debug` for the Debug derives.
ash = { version = "0.38", default-features = false, features = ["debug", "std"] }
# COM for the `d3d12` back end's generated bindings (src/gpu/d3d12_sys.rs).
windows-core = { version = "0.62", optional = true }

# The GPU back end of `lcgf::gpu`: Vulkan unless one of these is on (they exclude each other).
[features]
gles = []
wgpu = []
# lcgf::gpu on Metal: the Objective-C runtime and Metal opened at run time (macOS, iOS).
metal = []
# lcgf::gpu on Direct3D 12 (Windows; on Linux it builds for bindings/check's recorder).
d3d12 = ["dep:windows-core"]
# Link liblcgf_auto.a: the lane width chosen from the CPU at run time (x86-64 Linux).
lanes-auto = []
